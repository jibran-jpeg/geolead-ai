<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLead AI - Lead Extractor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="assets/icon-48.png" alt="GeoLead AI" class="logo-icon">
                <div>
                    <h1>GeoLead AI</h1>
                    <span class="version">v3.0.0</span>
                </div>
            </div>
            <div class="status" id="status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">Ready</span>
            </div>
        </header>

        <main class="main-content">
            <div class="section">
                <h2>Scraping Configuration</h2>
                
                <div class="form-group">
                    <label for="searchQuery">Search Query:</label>
                    <input type="text" id="searchQuery" placeholder="e.g., restaurants in Lahore" value="">
                </div>

                <div class="form-group">
                    <label for="maxResults">Max Results:</label>
                    <input type="number" id="maxResults" min="10" max="500" value="50">
                </div>

                <div class="form-group">
                    <label for="scrollDepth">Scroll Depth:</label>
                    <select id="scrollDepth">
                        <option value="1">1 page (20 results)</option>
                        <option value="2" selected>2 pages (40 results)</option>
                        <option value="3">3 pages (60 results)</option>
                        <option value="5">5 pages (100 results)</option>
                        <option value="10">10 pages (200 results)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="scrapingSpeed">Scraping Speed:</label>
                    <select id="scrapingSpeed">
                        <option value="fast">Fast (less accurate)</option>
                        <option value="normal" selected>Normal (balanced)</option>
                        <option value="slow">Slow (most accurate)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="categoryFilter">Category Filter:</label>
                    <input type="text" id="categoryFilter" placeholder="e.g., restaurant, dentist, lawyer">
                </div>
            </div>

            <div class="section">
                <h2>Features</h2>
                
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableDataValidation" checked>
                        <span class="checkmark"></span>
                        Enable Data Validation
                    </label>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableLeadScoring" checked>
                        <span class="checkmark"></span>
                        Enable Lead Scoring
                    </label>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableWebsiteAnalysis" checked>
                        <span class="checkmark"></span>
                        Website Analysis
                    </label>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableSocialMediaExtraction" checked>
                        <span class="checkmark"></span>
                        Social Media Extraction
                    </label>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enablePakistanRegional" checked>
                        <span class="checkmark"></span>
                        Pakistan Regional Mode
                    </label>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableAntiDetection" checked>
                        <span class="checkmark"></span>
                        Anti-Detection Mode
                    </label>
                </div>
            </div>

            <div class="section">
                <h2>Export Options</h2>
                
                <div class="form-group">
                    <label for="exportFormat">Export Format:</label>
                    <select id="exportFormat">
                        <option value="csv">CSV</option>
                        <option value="excel" selected>Excel (.xlsx)</option>
                        <option value="json">JSON</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="minRating">Minimum Rating:</label>
                    <input type="number" id="minRating" min="0" max="5" step="0.1" value="0">
                </div>

                <div class="form-group">
                    <label for="minReviews">Minimum Reviews:</label>
                    <input type="number" id="minReviews" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="priorityFilter">Priority Filter:</label>
                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="high">High Priority Only</option>
                        <option value="medium">Medium Priority Only</option>
                        <option value="low">Low Priority Only</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <button id="startScraping" class="btn btn-primary">
                    <span class="btn-icon">🚀</span>
                    Start Scraping
                </button>
                <button id="stopScraping" class="btn btn-secondary" disabled>
                    <span class="btn-icon">⏹️</span>
                    Stop Scraping
                </button>
                <button id="clearData" class="btn btn-outline">
                    <span class="btn-icon">🗑️</span>
                    Clear Data
                </button>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="progressText">0%</span>
                    <span id="progressCount">0 / 0</span>
                </div>
            </div>

            <div class="stats-section" id="statsSection">
                <h3>Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Total Leads:</span>
                        <span class="stat-value" id="totalLeads">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">High Priority:</span>
                        <span class="stat-value" id="highPriority">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Avg Rating:</span>
                        <span class="stat-value" id="avgRating">0.0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Success Rate:</span>
                        <span class="stat-value" id="successRate">0%</span>
                    </div>
                </div>
            </div>

            <div class="export-section" id="exportSection" style="display: none;">
                <h3>Export Data</h3>
                <div class="export-buttons">
                    <button id="exportNow" class="btn btn-success">
                        <span class="btn-icon">📥</span>
                        Export Now
                    </button>
                    <button id="viewData" class="btn btn-outline">
                        <span class="btn-icon">👁️</span>
                        View Data
                    </button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#" id="settingsLink">Settings</a>
                <a href="#" id="helpLink">Help</a>
                <a href="#" id="aboutLink">About</a>
            </div>
            <div class="footer-info">
                <span>© 2024 GeoLead AI</span>
                <span>|</span>
                <span id="lastUpdate">Never updated</span>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
